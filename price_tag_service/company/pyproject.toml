[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mengniu-recognition-services"
version = "0.1.0"
description = "Separated agent and business APIs for Mengniu recognition"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "SQLAlchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "Pillow>=10.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/prompts/*.txt", "resources/sku_samples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
